name: local.awesome-ai-usage
type: skill
description: "Orchestration skill for the awesome-ai skills-registry: guided install/setup, uninstall, and update/health-check workflows plus day-to-day management. Detects intent from the invocation. Installs skills via `npx skills` (local skills from knowttl/awesome-ai, remote skills from their upstreams), bundles via the `bin/skill` wrapper, companion npm packages via per-skill setup commands, and team sharing via catalog.json + skills-lock.json."
tags:

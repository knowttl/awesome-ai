name: knowttl.atelier-axi.atelier
type: skill
description: "Turn complex or visual agent responses into rich, reviewable HTML artifacts the user can annotate and send feedback on, and drive the feature-planning pipeline end to end, using the atelier-axi CLI. Use when about to give a plan, comparison, diagram, table, code diff, or report; when the user wants to plan or design something, or write a spec or plan; when asked to implement a plan.md or execute a finished plan; or for anything easier to grasp visually than as prose."

name: knowttl.atelier-axi.atelier-plan
type: skill
description: "Plan a feature, fix, or change before building it — surfaces clarifying questions, 2-3 candidate approaches with a recommendation, and open questions as an annotatable visual review surface in the browser (via atelier-axi), converges on an approved direction, then writes a durable spec.md + plan.md. Use when the user wants to plan or design something, write a spec or plan, or is about to jump into implementation without a validated plan."
